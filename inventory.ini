# The fleet Ansible manages. Hosts are grouped so a play can target a role.
# In real life these are provisioned servers; here they're named placeholders.

[trading_nodes]
node01 ansible_host=10.0.1.11
node02 ansible_host=10.0.1.12
node03 ansible_host=10.0.1.13

[gateways]
gw01 ansible_host=10.0.1.2

# A group-of-groups: "fleet" is everything we manage.
[fleet:children]
trading_nodes
gateways

# Variables applied to every host in the fleet.
[fleet:vars]
ansible_user=ops
ansible_python_interpreter=/usr/bin/python3
