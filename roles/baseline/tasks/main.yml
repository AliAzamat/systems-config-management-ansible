# The role's tasks — the same baseline, now living in a reusable role instead of
# inline in the playbook. A role bundles tasks, templates, handlers, and default
# variables under one directory so any play can pull it in with one line.
- name: Standardized packages are installed
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present
    update_cache: true

- name: A dedicated service user exists
  ansible.builtin.user:
    name: "{{ service_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: The app config is rendered from the template
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/trading/app.conf
    owner: "{{ service_user }}"
    mode: "0644"
  notify: Restart trading-gateway

- name: The trading-gateway service is enabled and running
  ansible.builtin.systemd:
    name: trading-gateway
    enabled: true
    state: started
